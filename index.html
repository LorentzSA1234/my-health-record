
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>My Health</title>
<style>
body{font-family:Arial;background:#eef3f5;margin:0;padding:15px;color:#243746}
h1{text-align:center;color:#176b65}
h2{color:#176b65}
.card{background:white;padding:15px;margin:12px 0;border-radius:12px;box-shadow:0 2px 6px #ccc}
input,select,button{width:100%;padding:12px;margin:6px 0;box-sizing:border-box;font-size:16px;border-radius:7px;border:1px solid #bbb}
button{background:#176b65;color:white;border:0;font-weight:bold}
table{width:100%;border-collapse:collapse}
td,th{padding:8px;border-bottom:1px solid #ddd;text-align:left}
canvas{width:100%;height:220px}
</style>
</head>
<body>
<h1>My Health</h1>
<p style="text-align:center">Personal Health Record</p>

<div class="card">
<h2>Blood Pressure</h2>
<input type="date" id="bpdate">
<input type="time" id="bptime">
<input type="number" id="sys" placeholder="Systolic (upper)">
<input type="number" id="dia" placeholder="Diastolic (lower)">
<input type="number" id="pulse" placeholder="Pulse">
<button onclick="addBP()">Save Blood Pressure</button>
<table id="bptable"></table>
<canvas id="graph"></canvas>
</div>

<div class="card">
<h2>Medication</h2>
<input id="med" placeholder="Medication name">
<input id="dose" placeholder="Dose">
<input type="datetime-local" id="medtime">
<button onclick="addMed()">Save Medication</button>
<div id="medlist"></div>
</div>

<div class="card">
<h2>Blood Test Results</h2>
<input type="date" id="labdate">
<input id="test" placeholder="Test (e.g. Sodium, Potassium, Creatinine)">
<input type="number" step="any" id="result" placeholder="Result">
<input id="unit" placeholder="Unit (e.g. mmol/L)">
<button onclick="addLab()">Save Blood Test</button>
<div id="lablist"></div>
</div>

<div class="card">
<h2>Export Health Record</h2>
<button onclick="exportPDF()">Export / Print PDF</button>
</div>

<script>
let bp=JSON.parse(localStorage.getItem('bp')||'[]');
let meds=JSON.parse(localStorage.getItem('meds')||'[]');
let labs=JSON.parse(localStorage.getItem('labs')||'[]');

function save(){
localStorage.setItem('bp',JSON.stringify(bp));
localStorage.setItem('meds',JSON.stringify(meds));
localStorage.setItem('labs',JSON.stringify(labs));
}
function today(){
let d=new Date();
return d.toISOString().slice(0,10);
}
document.getElementById('bpdate').value=today();
document.getElementById('labdate').value=today();

function addBP(){
let s=Number(document.getElementById('sys').value);
let d=Number(document.getElementById('dia').value);
if(!s||!d){alert('Enter both blood pressure numbers');return}
bp.push({date:document.getElementById('bpdate').value,time:document.getElementById('bptime').value,sys:s,dia:d,pulse:document.getElementById('pulse').value});
save();render();
}
function addMed(){
let m=document.getElementById('med').value;
if(!m){alert('Enter medication name');return}
meds.push({name:m,dose:document.getElementById('dose').value,time:document.getElementById('medtime').value});
save();render();
}
function addLab(){
let t=document.getElementById('test').value;
let r=document.getElementById('result').value;
if(!t||r===''){alert('Enter test and result');return}
labs.push({date:document.getElementById('labdate').value,test:t,result:r,unit:document.getElementById('unit').value});
save();render();
}
function render(){
document.getElementById('bptable').innerHTML='<tr><th>Date</th><th>BP</th><th>Pulse</th></tr>'+bp.map(x=>`<tr><td>${x.date}</td><td>${x.sys}/${x.dia}</td><td>${x.pulse||'-'}</td></tr>`).join('');
document.getElementById('medlist').innerHTML=meds.map(x=>`<p>${x.time||''} — ${x.name} ${x.dose}</p>`).join('');
document.getElementById('lablist').innerHTML=labs.map(x=>`<p>${x.date} — ${x.test}: ${x.result} ${x.unit}</p>`).join('');
drawGraph();
}
function drawGraph(){
let c=document.getElementById('graph'),ctx=c.getContext('2d');
c.width=c.clientWidth*devicePixelRatio;c.height=220*devicePixelRatio;
ctx.scale(devicePixelRatio,devicePixelRatio);
ctx.clearRect(0,0,c.width,c.height);
if(!bp.length){ctx.fillText('Blood pressure graph will appear here',10,30);return}
let data=bp.slice(-12),max=Math.max(180,...data.map(x=>x.sys));
let min=40;
function line(key,color){
ctx.strokeStyle=color;ctx.lineWidth=2;ctx.beginPath();
data.forEach((x,i)=>{
let px=10+i*(c.clientWidth-20)/Math.max(1,data.length-1);
let py=195-(x[key]-min)*165/(max-min);
if(i===0)ctx.moveTo(px,py);else ctx.lineTo(px,py);
});ctx.stroke();
}
line('sys','#d34b4b');line('dia','#2478bb');
ctx.fillStyle='#333';ctx.fillText('Red: systolic   Blue: diastolic',10,15);
}
function exportPDF(){window.print()}
render();
</script>
</body>
</html>
